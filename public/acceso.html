<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Portal - Guardián POS</title>
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #161616;
            --accent-orange: #FF6D00;
            --text-main: #f1f1f1;
            --text-muted: #aaaaaa;
            --border-color: #262626;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .auth-container {
            width: 100%;
            max-width: 420px;
            background-color: var(--card-bg);
            border: 2px solid var(--accent-orange);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }
        .brand-title {
            text-align: center;
            color: var(--accent-orange);
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        .brand-subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
            margin-bottom: 25px;
        }
        /* Pestañas de Navegación */
        .auth-tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }
        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 10px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            color: var(--accent-orange);
            border-bottom: 2px solid var(--accent-orange);
        }
        .form-section {
            display: none;
        }
        .form-section.active {
            display: block;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: bold;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            background-color: #0b0b0b;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 14px;
            box-sizing: border-box;
        }
        .input-group input:focus {
            border-color: var(--accent-orange);
            outline: none;
        }
        .btn-submit {
            width: 100%;
            background-color: var(--accent-orange);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background-color: #e56100;
        }
        .back-home {
            text-align: center;
            margin-top: 20px;
        }
        .back-home a {
            color: var(--text-muted);
            font-size: 12px;
            text-decoration: none;
        }
        .back-home a:hover {
            color: var(--accent-orange);
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="brand-title">GUARDIÁN POS</div>
        <div class="brand-subtitle">Portal Administrativo de Clientes</div>

        <!-- Pestañas -->
        <div class="auth-tabs">
            <button class="tab-btn active" onclick="cambiarTab('login')">Iniciar Sesión</button>
            <button class="tab-btn" onclick="cambiarTab('activar')">Primera Vez / Activar</button>
        </div>

        <!-- SECCIÓN 1: INICIAR SESIÓN -->
        <div id="section-login" class="form-section active">
            <form onsubmit="realizarLogin(event)">
                <div class="input-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="login-email" required placeholder="correo@negocio.com">
                </div>
                <div class="input-group">
                    <label>Contraseña Web</label>
                    <input type="password" id="login-password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-submit">ENTRAR AL PANEL</button>
            </form>
        </div>

        <!-- SECCIÓN 2: PRIMERA VEZ / ACTIVAR CUENTA WEB -->
        <div id="section-activar" class="form-section">
            <form onsubmit="verificarActivacion(event)">
                <div class="input-group">
                    <label>Número de Cliente o Licencia</label>
                    <input type="text" id="activar-licencia" required placeholder="Ej. GPOS-TRIAL-XXXX o CLI-XXXX">
                </div>
                <div class="input-group">
                    <label>Correo Electrónico Registrado</label>
                    <input type="email" id="activar-email" required placeholder="correo@negocio.com">
                </div>
                <button type="submit" class="btn-submit" id="btn-verificar">VERIFICAR DATOS</button>
            </form>
        </div>

        <div class="back-home">
            <a href="/">&larr; Volver a la página principal</a>
        </div>
    </div>

    <script>
        // Cambiar entre pestañas de Login y Activación
        function cambiarTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.form-section').forEach(sec => sec.classList.remove('active'));

            if (tab === 'login') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('section-login').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('section-activar').classList.add('active');
            }
        }

        // Variable temporal para almacenar el ID de la licencia al verificar los datos
        let licenciaVerificadaId = null;

        // 1. LÓGICA DE INICIO DE SESIÓN WEB
        async function realizarLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                const response = await fetch('/api/licencias/web/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.exito) {
                    alert('¡Bienvenido al panel!');
                    window.location.href = 'panel.html';
                } else {
                    alert('Error: ' + (data.error || 'Credenciales incorrectas'));
                }
            } catch (error) {
                console.error('Error en el login:', error);
                alert('No se pudo conectar con el servidor.');
            }
        }

        // 2. LÓGICA DE ACTIVACIÓN / PRIMERA VEZ (Paso 1: Verificar datos)
        async function verificarActivacion(e) {
            e.preventDefault();
            const licencia = document.getElementById('activar-licencia').value;
            const email = document.getElementById('activar-email').value;

            const btnVerificar = document.getElementById('btn-verificar');
            btnVerificar.innerText = 'VERIFICANDO...';
            btnVerificar.disabled = true;

            try {
                const response = await fetch('/api/licencias/web/verificar-activacion', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ licencia, email })
                });

                const data = await response.json();

                if (data.exito) {
                    licenciaVerificadaId = data.idLicencia;
                    
                    // Transformamos el formulario de activación para pedir la nueva contraseña web
                    const formContainer = document.getElementById('section-activar');
                    formContainer.innerHTML = `
                        <div style="background-color: #1b331c; border: 1px solid #2e7d32; padding: 10px; border-radius: 6px; font-size: 12px; color: #81c784; margin-bottom: 15px; text-align: center;">
                            ¡Datos verificados con éxito! Ahora cree su contraseña web de acceso.
                        </div>
                        <form onsubmit="guardarPasswordWeb(event)">
                            <div class="input-group">
                                <label>Nueva Contraseña Web</label>
                                <input type="password" id="nuevo-password" required placeholder="••••••••">
                            </div>
                            <button type="submit" class="btn-submit">GUARDAR CONTRASEÑA Y ACCEDER</button>
                        </form>
                    `;
                } else {
                    alert('Aviso: ' + (data.error || 'No se encontró ningún registro con esos datos.'));
                    btnVerificar.innerText = 'VERIFICAR DATOS';
                    btnVerificar.disabled = false;
                }
            } catch (error) {
                console.error('Error al verificar:', error);
                alert('Error de conexión con el servidor.');
                btnVerificar.innerText = 'VERIFICAR DATOS';
                btnVerificar.disabled = false;
            }
        }

        // 3. LÓGICA DE CREACIÓN DE CONTRASEÑA WEB (Paso 2)
        async function guardarPasswordWeb(e) {
            e.preventDefault();
            const passwordWeb = document.getElementById('nuevo-password').value;

            if (!licenciaVerificadaId) {
                alert('Sesión de verificación expirada. Por favor inicie el proceso de nuevo.');
                location.reload();
                return;
            }

            try {
                const response = await fetch('/api/licencias/web/crear-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idLicencia: licenciaVerificadaId, passwordWeb })
                });

                const data = await response.json();

                if (data.exito) {
                    alert(data.mensaje);
                    cambiarTab('login');
                } else {
                    alert('Error: ' + (data.error || 'No se pudo guardar la contraseña.'));
                }
            } catch (error) {
                console.error('Error al guardar contraseña:', error);
                alert('Error de conexión con el servidor.');
            }
        }
    </script>

</body>
</html>
